name: ORM compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.runtime }}${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The same suite on each runtime, against the same three databases and
        # Redis: Bun runs it with bun:test over bun:sql, Node.js with vitest
        # over the node:sqlite, pg, mysql2 and ioredis adapters (tests/harness.ts).
        include:
          - runtime: bun
          # The oldest release package.json accepts, the newest 24.x, and 26.
          - { runtime: node, node: 24.21.0 }
          - { runtime: node, node: 24 }
          - { runtime: node, node: 26 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: orm_test
          POSTGRES_DB: orm_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d orm_test" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: orm_test
          MYSQL_DATABASE: orm_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -porm_test" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_TEST_URL: postgres://postgres:orm_test@127.0.0.1:5432/orm_test
      # Require TLS for MySQL 8's caching_sha2_password authentication.
      MYSQL_TEST_URL: mysql://root:orm_test@127.0.0.1:3306/orm_test?ssl-mode=require
      REDIS_TEST_URL: redis://127.0.0.1:6379
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      # Bun installs and builds in both jobs; only the Node.js job runs the suite on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run scripts/verify-services.ts
      - run: bun run build
      - if: matrix.runtime == 'bun'
        run: bun run test
      - if: matrix.runtime == 'node'
        run: node --version && node ./node_modules/vitest/vitest.mjs run
      # The suite again with the process in zones around the world: far west and
      # far east of UTC, half- and three-quarter-hour offsets, and daylight saving
      # in both hemispheres. The ORM stores UTC, so the process zone must not
      # change a result. Every zone runs even after one fails.
      - name: suite in other time zones
        run: |
          failed=""
          for tz in Pacific/Pago_Pago America/New_York America/St_Johns Asia/Kathmandu Australia/Lord_Howe Pacific/Chatham Pacific/Kiritimati; do
            echo "::group::TZ=$tz"
            # An unknown zone falls back to UTC in silence and would pass for nothing.
            if ! TZ=$tz ${{ matrix.runtime }} -e 'process.exit(new Date(Date.UTC(2024, 0, 15)).getTimezoneOffset() === 0 ? 1 : 0)'; then
              echo "::error::TZ=$tz is not applied by ${{ matrix.runtime }}"
              failed="$failed $tz"
            elif [ "${{ matrix.runtime }}" = bun ]; then
              TZ=$tz bun test --parallel --path-ignore-patterns='**/benchmark*' || failed="$failed $tz"
            else
              TZ=$tz node ./node_modules/vitest/vitest.mjs run || failed="$failed $tz"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Suite failed with TZ=$failed"; exit 1; fi
      - if: matrix.runtime == 'bun'
        run: bun audit
